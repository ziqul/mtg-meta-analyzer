name: Stage Deploy

# Start it from the Actions tab: Stage Deploy → Run workflow, and pick a
# branch. Builds the tip of that branch and pushes the output to site/ on the
# Stage repo's master branch; the Stage repo's own workflow publishes it to
# GitHub Pages. Only people with write access can run workflows by hand.
#
# Setup and walkthrough: docs/stage-environment.md

on:
  workflow_dispatch:

permissions: {}

# A newer run replaces a deploy that is still running.
concurrency:
  group: stage-deploy
  cancel-in-progress: true

env:
  STAGE_REPO: mtg-meta-analyzer-stage
  STAGE_BRANCH: master

jobs:
  # The build runs the branch's code (bun install, vite build), so it gets no
  # secrets and a read-only GITHUB_TOKEN. Only the publish job holds the deploy
  # key, and it runs none of the branch's code.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          BASE_PATH: /${{ env.STAGE_REPO }}

      - uses: actions/upload-artifact@v7
        with:
          name: stage-site
          path: build
          retention-days: 1

  publish:
    name: Push to Stage repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The deploy key can write to the Stage repo and nothing else. Unlike a
      # GITHUB_TOKEN push, a deploy-key push starts the Stage repo's workflow.
      # Full history, so the last deploy commit can be found under any commits
      # made since. It stays small (see below), and having it locally lets git
      # send only the files that changed.
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ env.STAGE_REPO }}
          ref: ${{ env.STAGE_BRANCH }}
          ssh-key: ${{ secrets.STAGE_DEPLOY_KEY }}
          fetch-depth: 0
          path: stage

      - uses: actions/download-artifact@v8
        with:
          name: stage-site
          path: site-new

      # master holds at most one build: the Stage repo's own files (workflow,
      # README, CLAUDE.md) with exactly one deploy commit holding site/. A new
      # deploy replaces the previous one instead of stacking on it, and names
      # it in a Replaces: line, so old builds never pile up in history.
      - name: Commit and push
        working-directory: stage
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SENDER: ${{ github.actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TIP=$(git rev-parse HEAD)
          LAST_DEPLOY=$(git log --first-parent -1 --format=%H --grep='^Stage-Deploy:' HEAD)

          # Start from master's files without the old build.
          git checkout -q --detach "$TIP"
          git rm -rq --ignore-unmatch site
          rm -rf site

          if [ -z "$LAST_DEPLOY" ]; then
            BASE=$TIP
          elif [ "$LAST_DEPLOY" = "$TIP" ]; then
            BASE=$(git rev-parse "$TIP^")
          else
            # The repo's own files changed on top of the last deploy. Fold
            # those changes into one commit on the deploy's parent, so the old
            # build drops out of history; the message lists what was folded.
            {
              echo "Stage repo changes since the last deploy"
              echo
              git log --first-parent --format='- %s (%h)' "$LAST_DEPLOY..$TIP"
            } > ../base-message.txt
            BASE=$(git commit-tree "$(git write-tree)" -p "$LAST_DEPLOY^" -F ../base-message.txt)
          fi

          mv ../site-new site
          git add site

          {
            echo "Deploy ${SOURCE_BRANCH} @ ${SOURCE_SHA:0:7}"
            echo
            echo "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA"
            echo "Requested-by: $SENDER"
            if [ -n "$LAST_DEPLOY" ]; then
              echo "Replaces: $(git log -1 --format='%h (%s)' "$LAST_DEPLOY")"
            fi
            echo "Stage-Deploy: $SOURCE_SHA"
          } > ../message.txt
          COMMIT=$(git commit-tree "$(git write-tree)" -p "$BASE" -F ../message.txt)

          # The lease refuses the push if master moved since we fetched it.
          git push --force-with-lease="${STAGE_BRANCH}:${TIP}" origin "${COMMIT}:refs/heads/${STAGE_BRANCH}"

      - name: Summary
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "Pushed \`${SOURCE_BRANCH}\` @ \`${SOURCE_SHA:0:7}\` to Stage."
            echo
            echo "- Pages deploy: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY_OWNER/$STAGE_REPO/actions"
            echo "- Site (live in a minute or two): https://${GITHUB_REPOSITORY_OWNER}.github.io/${STAGE_REPO}/"
          } >> "$GITHUB_STEP_SUMMARY"
